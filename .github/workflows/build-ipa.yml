name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'tests/**', 'research/**']
  workflow_dispatch:
    inputs:
      stages:
        description: 'Stages to run (space separated; empty = all)'
        required: false
        default: ''

# Runs queue rather than cancel: a cancelled run would throw away stages it already built.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      # Submodules are fetched by ci/build-all.sh only for the stages that rebuild.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install bash zstd ldid xcbeautify

      # One cache for every stage's outputs (ci/build-all.sh keys each stage itself). The
      # newest entry is restored; a run saves a new one only when a stage was rebuilt.
      - name: Restore stage cache
        uses: actions/cache/restore@v4
        with:
          path: .stage-cache
          key: stages-${{ github.run_id }}
          restore-keys: stages-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build
        env:
          LOGS: ${{ github.workspace }}/ci-logs
          OUT: ${{ github.workspace }}/ci-out
          CACHE: ${{ github.workspace }}/.stage-cache
        run: |
          "$(brew --prefix)/bin/bash" ci/build-all.sh ${{ github.event.inputs.stages }}

      - name: Save stage cache
        if: always() && hashFiles('.stage-cache/changed.marker') != ''
        uses: actions/cache/save@v4
        with:
          path: .stage-cache
          key: stages-${{ github.run_id }}

      - name: Save ccache
        if: always() && hashFiles('.stage-cache/changed.marker') != ''
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ci-logs

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ci-out/*.ipa
          if-no-files-found: ignore
